; Supervisor configuration for BreadCount Spool Services (Accuracy Mode)
;
; These services provide spool-to-disk functionality for H.264 frames
; to enable accurate frame-by-frame processing without drops.
;
; Installation:
;   sudo cp supervisor/breadcount-spool.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;
; Usage:
;   sudo supervisorctl start breadcount-spool-recorder
;   sudo supervisorctl start breadcount-spool-processor
;   sudo supervisorctl status breadcount-spool-recorder breadcount-spool-processor

[program:breadcount-spool-recorder]
command=/usr/bin/python3 -m src.ros2_spool.spool_recorder_node
directory=/home/sunrise/BreadCounting
user=sunrise
autostart=false
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
stdout_logfile=/home/sunrise/BreadCounting/data/logs/spool-recorder.log
stderr_logfile=/home/sunrise/BreadCounting/data/logs/spool-recorder-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=HOME="/home/sunrise",RMW_IMPLEMENTATION="rmw_cyclonedds_cpp",CYCLONEDDS_URI="file:///home/sunrise/BreadCounting/cyclonedds.xml"

[program:breadcount-spool-processor]
command=/usr/bin/python3 -m src.ros2_spool.spool_processor_node
directory=/home/sunrise/BreadCounting
user=sunrise
autostart=false
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
stdout_logfile=/home/sunrise/BreadCounting/data/logs/spool-processor.log
stderr_logfile=/home/sunrise/BreadCounting/data/logs/spool-processor-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=HOME="/home/sunrise",RMW_IMPLEMENTATION="rmw_cyclonedds_cpp",CYCLONEDDS_URI="file:///home/sunrise/BreadCounting/cyclonedds.xml"
